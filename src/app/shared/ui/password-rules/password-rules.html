<ul class="password-rules" aria-live="polite">
  @for (rule of rules(); track rule.rule) {
    <li class="password-rules__item" [class.password-rules__item--passed]="rule.passed">
      <app-icon [name]="rule.passed ? 'check-circle' : 'alert-circle'" />
      {{ rule.label }}
      <span class="u-visually-hidden">{{ rule.passed ? '(cumplido)' : '(pendiente)' }}</span>
    </li>
  }
</ul>
