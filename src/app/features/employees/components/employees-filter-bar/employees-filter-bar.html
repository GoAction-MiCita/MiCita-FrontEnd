<form
  class="filter-bar"
  role="search"
  aria-label="Filtrar empleados"
  [formGroup]="form"
  (submit)="$event.preventDefault()"
>
  <label class="filter-bar__search">
    <span class="u-visually-hidden">Buscar por nombre o apellido</span>
    <app-icon name="search" />
    <input
      type="search"
      formControlName="name"
      maxlength="100"
      autocomplete="off"
      placeholder="Buscar por nombre o apellido"
    />
  </label>

  <label class="filter-bar__status">
    <span class="filter-bar__label">Estado</span>
    <select formControlName="status">
      <option value="">Todos</option>
      <option [value]="status.active">Activo</option>
      <option [value]="status.inactive">Inactivo</option>
    </select>
  </label>

  <app-multi-select
    class="filter-bar__services"
    formControlName="serviceIds"
    label="Filtrar por servicios"
    icon="layout-grid"
    hideLabel
    [showChips]="false"
    [texts]="servicePickerTexts"
    [options]="serviceOptions()"
    [loading]="servicesLoading()"
    [failed]="servicesFailed()"
  />

  @if (canClear()) {
    <button class="filter-bar__clear" type="button" (click)="clear()">
      <app-icon name="x" />
      Limpiar filtros
    </button>
  }
</form>
