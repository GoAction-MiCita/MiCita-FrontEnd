<app-filter-bar
  label="Filtrar empleados"
  searchLabel="Buscar por nombre o apellido"
  [name]="filters().name"
  [canClear]="canClear()"
  (nameChange)="changeName($event)"
  (cleared)="clear()"
>
  <label class="employees-filter-bar__status">
    <span class="employees-filter-bar__label">Estado</span>
    <select [formControl]="statusControl">
      <option value="">Todos</option>
      <option [value]="status.active">Activo</option>
      <option [value]="status.inactive">Inactivo</option>
    </select>
  </label>

  <app-multi-select
    class="employees-filter-bar__services"
    [formControl]="serviceIdsControl"
    label="Filtrar por servicios"
    icon="layout-grid"
    hideLabel
    [showChips]="false"
    [texts]="servicePickerTexts"
    [options]="serviceOptions()"
    [loading]="servicesLoading()"
    [failed]="servicesFailed()"
  />
</app-filter-bar>
