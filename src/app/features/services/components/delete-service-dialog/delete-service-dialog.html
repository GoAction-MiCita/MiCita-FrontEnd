<dialog
  #dialog
  class="delete-dialog"
  role="alertdialog"
  aria-labelledby="delete-dialog-title"
  aria-describedby="delete-dialog-description"
  (cancel)="onCancel($event)"
  (close)="closed.emit()"
>
  <span class="delete-dialog__icon"><app-icon name="trash" /></span>
  <h2 id="delete-dialog-title" class="delete-dialog__title">Eliminar servicio</h2>
  <p id="delete-dialog-description" class="delete-dialog__description">
    ¿Seguro que quieres eliminar <strong>«{{ service().name }}»</strong>? Dejará de aparecer en tu
    listado y tus clientes no podrán agendarlo.
  </p>

  @if (failure(); as failure) {
    <app-alert [title]="failure.title">{{ failure.summary }}</app-alert>
  }

  <div class="delete-dialog__actions">
    @if (blocked()) {
      <button class="delete-dialog__cancel" type="button" (click)="close()">Cerrar</button>
    } @else {
      <button class="delete-dialog__cancel" type="button" [disabled]="pending()" (click)="close()">
        Cancelar
      </button>
      <button
        class="delete-dialog__confirm"
        type="button"
        [disabled]="pending()"
        [attr.aria-busy]="pending() || null"
        (click)="confirm()"
      >
        {{ pending() ? 'Eliminando…' : 'Eliminar' }}
      </button>
    }
  </div>
</dialog>
