<app-filter-bar
  label="Filtrar servicios"
  searchLabel="Buscar por nombre"
  [name]="filters().name"
  [canClear]="canClear()"
  (nameChange)="changeName($event)"
  (cleared)="clear()"
>
  <label class="services-filter-bar__status">
    <span class="services-filter-bar__label">Estado</span>
    <select [formControl]="statusControl">
      <option value="">Todos</option>
      <option [value]="status.active">Activo</option>
      <option [value]="status.inactive">Inactivo</option>
    </select>
  </label>

  <app-multi-select
    class="services-filter-bar__employees"
    [formControl]="employeeIdsControl"
    label="Filtrar por empleados"
    icon="users"
    avatars
    hideLabel
    [showChips]="false"
    [texts]="employeePickerTexts"
    [options]="employees()"
    [loading]="employeesLoading()"
    [failed]="employeesFailed()"
  />
</app-filter-bar>
