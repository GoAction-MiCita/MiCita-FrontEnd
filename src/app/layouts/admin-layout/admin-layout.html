<header class="admin-layout__bar">
  <a class="admin-layout__brand" routerLink="/dashboard">
    <span class="admin-layout__logo"><app-icon name="logo" /></span>
    Mi Cita
  </a>

  <nav class="admin-layout__nav" aria-label="Principal">
    <a
      class="admin-layout__link"
      routerLink="/dashboard"
      routerLinkActive="admin-layout__link--active"
      ariaCurrentWhenActive="page"
    >
      <app-icon name="home" />
      Inicio
    </a>
    <a
      class="admin-layout__link"
      routerLink="/servicios"
      routerLinkActive="admin-layout__link--active"
      ariaCurrentWhenActive="page"
    >
      <app-icon name="layout-grid" />
      Servicios
    </a>
  </nav>

  <div class="admin-layout__session">
    @if (session.user()?.username; as username) {
      <span class="admin-layout__user">{{ username }}</span>
    }
    <button class="admin-layout__logout" type="button" [disabled]="loggingOut()" (click)="logout()">
      <app-icon name="log-out" />
      Cerrar sesión
    </button>
  </div>
</header>

<main class="admin-layout__content">
  <router-outlet />
</main>
